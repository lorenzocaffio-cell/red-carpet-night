<!doctype html>
<html lang="it">
<head>
<title>Red Carpet Night</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,800;0,900;1,400;1,700;1,900&display=swap">
<style>[hidden]{display:none!important}html,body{margin:0;background:#070708}</style>
<style>
/* Layout: palco nero con fasci di luce e velluto rosso. Header fisso in alto, tab bar in basso, contenuto centrato (max 1080px) a schede. */
:root{
  --ink:#070708; --coal:#0f0f12; --panel:#15151a; --panel-2:#1c1c22;
  --gold:#d4af37; --gold-hi:#f4e4a1; --gold-lo:#8a6a1c;
  --velvet:#8b0f1d; --velvet-hi:#b3182a;
  --fg:#f5f0e6; --mute:#9a97a8; --ok:#7fd49a;
  --line:rgba(212,175,55,.30); --line-soft:rgba(255,255,255,.09);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --foil:linear-gradient(135deg,#8a6a1c 0%,#f4e4a1 38%,#d4af37 56%,#8a6a1c 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--fg);font:400 16px/1.5 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
img{display:block}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:8px}

/* sfondo */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% -12%,rgba(139,15,29,.30),transparent 62%),radial-gradient(80% 50% at 100% 112%,rgba(212,175,55,.08),transparent 60%)}
.beam{position:absolute;top:-10%;left:-12vmax;width:46vmax;height:120vmax;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,236,170,.24),rgba(255,236,170,0) 70%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);filter:blur(14px);opacity:.5;animation:sway 11s ease-in-out infinite alternate}
.beam.b2{left:auto;right:-14vmax;opacity:.38;animation-duration:15s;animation-direction:alternate-reverse}
@keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.wrap{width:100%;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(7,7,8,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand svg{width:30px;height:30px;color:var(--gold);flex:none}
.brand b{font:500 clamp(22px,6vw,30px)/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand b em{font-style:italic;color:var(--gold)}
.ibtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-soft);background:transparent;display:grid;place-items:center;color:var(--mute);flex:none;transition:.2s}
.ibtn svg{width:22px;height:22px}
.ibtn.on{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.08)}
.ibtn:hover{color:var(--gold-hi)}

.ticker{position:relative;z-index:2;overflow:hidden;border-bottom:1px solid var(--line-soft);background:rgba(15,15,18,.7);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker-track{display:flex;width:max-content;animation:tick 42s linear infinite;padding-block:8px}
.ticker span{font:500 11px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--mute);white-space:nowrap;padding-inline:18px}
.ticker span.s{color:var(--gold);padding-inline:0}
@keyframes tick{to{transform:translateX(-50%)}}

.strip{position:relative;z-index:2;background:rgba(139,15,29,.25);border-bottom:1px solid rgba(179,24,42,.4);font-size:13px;color:#f0d7da}
.strip .wrap{padding-block:8px}

main{position:relative;z-index:1;padding-block:26px 120px}

/* tipografia */
.eyebrow{font:500 12px/1.2 var(--body);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.display{font:500 clamp(34px,9vw,60px)/1.06 var(--display);letter-spacing:-.015em;text-wrap:balance}
.display em{font-style:italic;font-weight:500;color:var(--gold)}
.h2{font:500 clamp(30px,7.4vw,46px)/1.08 var(--display);letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--mute);font-size:17px;max-width:46ch;text-wrap:pretty}
.mute{color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:14px;margin-top:38px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.link{color:var(--gold);background:none;border:0;padding:6px 0;font-weight:500;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.link svg{width:18px;height:18px}

/* pulsanti */
.btn{border-radius:999px;border:1.5px solid var(--gold);padding:16px 26px;font-weight:500;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:transparent;color:var(--gold-hi);transition:transform .15s,box-shadow .2s,background .2s}
.btn svg{width:22px;height:22px}
.btn.gold{background:linear-gradient(180deg,#e3c55b,#c99d2b);color:#16120a;border-color:transparent;font-weight:600;box-shadow:0 10px 30px -10px rgba(212,175,55,.55)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.cta-row .btn{flex:1 1 200px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-soft);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--mute);background:rgba(255,255,255,.02)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.chip.live{color:var(--fg);border-color:var(--line)}
.chip.live i{background:var(--gold);box-shadow:0 0 0 0 rgba(212,175,55,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(212,175,55,0)}100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}}

/* hero */
.hero{display:flex;flex-direction:column;gap:20px;padding-block:10px 6px}
.reveal-line{display:block;overflow:hidden;padding-bottom:.08em}
.reveal-line>span{display:block}
.anim .reveal-line>span{animation:up 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d)*.14s + .15s)}
@keyframes up{from{transform:translateY(108%)}}
.anim .lead,.anim .cta-row,.anim .eyebrow,.anim .chips{animation:fade .9s ease backwards;animation-delay:.5s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}

/* card coppia */
.carousel{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 26px;margin-inline:-2px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .card{flex:0 0 min(78%,320px);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding-block:6px}
.card{position:relative;aspect-ratio:5/7;border-radius:30px;border:1.5px solid transparent;background:linear-gradient(var(--coal),var(--coal)) padding-box,var(--foil) border-box;overflow:hidden;cursor:pointer;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease,box-shadow .3s;box-shadow:0 30px 60px -30px rgba(212,175,55,.35);isolation:isolate}
.card:hover{box-shadow:0 36px 70px -26px rgba(212,175,55,.5)}
.card .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,7,8,0) 38%,rgba(7,7,8,.78) 66%,#0a0a0c 100%)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 36%,rgba(244,228,161,.2) 50%,transparent 64%);background-size:260% 100%;animation:foil 7s ease-in-out infinite;animation-delay:calc(var(--i,0)*-1.3s);pointer-events:none;mix-blend-mode:screen}
@keyframes foil{0%{background-position:150% 0}55%,100%{background-position:-60% 0}}
.badge{position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:8px;background:rgba(58,38,18,.86);border-radius:999px;padding:9px 16px 9px 12px;font:500 14px/1 var(--body);letter-spacing:.26em;color:var(--gold-hi)}
.badge svg{width:18px;height:18px;color:var(--gold)}
.card .logo{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold);background:var(--ink)}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:0 22px 22px;display:flex;flex-direction:column;gap:8px}
.card .info .eyebrow{font-size:11px;letter-spacing:.38em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .info h3{font:500 clamp(26px,6vw,32px)/1.08 var(--display);text-wrap:balance}
.card .info hr{border:0;border-top:1px solid var(--line);margin:6px 0 2px;width:100%}
.card .info .names{color:var(--mute);font-size:17px}
.card .info .names b{color:var(--gold);font-weight:400}
.card .kind{align-self:flex-start;font-size:11px;letter-spacing:.24em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--gold-hi)}
.enter{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}}

.empty{border:1px dashed var(--line);border-radius:28px;padding:34px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--mute)}
.empty h3{font:500 26px/1.15 var(--display);color:var(--fg)}
.loader{display:grid;place-items:center;min-height:50vh;color:var(--mute);gap:14px;text-align:center}
.loader i{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* form */
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl{font:500 12px/1.2 var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.field small{color:var(--mute);font-size:13px}
.inp{width:100%;background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:15px 16px;color:var(--fg);font-size:17px;transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.12)}
.inp.bad{border-color:var(--velvet-hi)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 90px;background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;padding:12px 14px;color:var(--mute);font-weight:500;transition:.2s}
.seg button.on{border-color:var(--gold);color:#16120a;background:linear-gradient(180deg,#e3c55b,#c99d2b)}
.uploads{display:grid;grid-template-columns:1fr;gap:16px}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:22px;background:var(--panel);display:flex;gap:16px;align-items:center;padding:16px;cursor:pointer;min-width:0;transition:border-color .2s}
.drop:hover{border-color:var(--gold)}
.drop input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.drop .pv{flex:none;width:86px;height:86px;border-radius:50%;background:var(--panel-2) center/cover;display:grid;place-items:center;color:var(--gold);border:1px solid var(--line-soft)}
.drop .pv.sq{border-radius:18px;width:86px;height:108px}
.drop .pv svg{width:30px;height:30px}
.drop .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.drop .tx b{font-weight:500}
.drop .tx span{color:var(--mute);font-size:14px}
.err{color:#ff9aa5;font-size:15px;min-height:1.3em}

/* ticket codice */
.ticket{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,#17171b,#101013);padding:20px 18px}
.ticket>svg{width:36px;height:36px;color:var(--gold);flex:none}
.ticket .code{flex:1;min-width:0;font:500 clamp(30px,9vw,46px)/1 var(--display);letter-spacing:.2em;background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;user-select:all;white-space:nowrap;overflow:hidden}
.ticket .ibtn{border-color:var(--line);color:var(--gold)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,10,12,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex;gap:2px;padding-block:6px}
.tab{flex:1 1 0;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;color:var(--mute);font-size:10.5px;letter-spacing:.04em;position:relative;transition:color .2s}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--gold)}
.tab.on::before{content:"";position:absolute;top:-7px;left:50%;width:26px;height:3px;border-radius:3px;margin-left:-13px;background:var(--gold);box-shadow:0 0 14px var(--gold)}

/* voto: likert */
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--gold);padding:6px 0;font-weight:500}
.back svg{width:20px;height:20px}
.vcard{display:flex;gap:14px;align-items:center;border:1px solid var(--line-soft);border-radius:22px;padding:12px;background:var(--panel);text-align:left;width:100%;transition:border-color .2s}
.vcard:hover{border-color:var(--line)}
.vcard img{width:64px;height:80px;object-fit:cover;border-radius:14px;flex:none;background:var(--panel-2)}
.vcard .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.vcard .m b{font:500 20px/1.15 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard .m span{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:6px 11px;border:1px solid var(--line-soft);color:var(--mute);white-space:nowrap}
.state.done{border-color:var(--gold);color:var(--gold-hi)}
.state.part{border-color:var(--line);color:var(--gold)}
.vhead{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line)}
.vhead img{width:100%;height:100%;object-fit:cover}
.vhead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(7,7,8,.92))}
.vhead .tt{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;display:flex;flex-direction:column;gap:4px}
.vhead .tt h2{font:500 30px/1.1 var(--display)}
.likert{display:flex;flex-direction:column;gap:12px;padding:20px 0;border-bottom:1px solid var(--line-soft)}
.likert:last-of-type{border-bottom:0}
.likert h4{font:500 22px/1.15 var(--display)}
.likert p{color:var(--mute);font-size:15px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lk{position:relative;aspect-ratio:1;max-height:62px;border-radius:50%;border:1.5px solid var(--line-soft);background:var(--panel);font:500 22px/1 var(--display);color:var(--mute);transition:transform .15s,background .2s,border-color .2s,color .2s,box-shadow .25s}
.lk.fill{border-color:var(--line);color:var(--gold-hi);background:rgba(212,175,55,.1)}
.lk.on{background:linear-gradient(180deg,#f0d77a,#c99d2b);color:#16120a;border-color:transparent;box-shadow:0 0 0 4px rgba(212,175,55,.16),0 10px 24px -8px rgba(212,175,55,.7);transform:scale(1.08)}
.lk.on::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--gold-hi);animation:ping .6s ease-out forwards}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.lk[disabled]{pointer-events:none;opacity:.6}
.ends{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.group-t{display:flex;align-items:center;gap:12px;margin-top:26px}
.group-t i{flex:1;height:1px;background:var(--line)}
.group-t.soft i{background:var(--line-soft)}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.savebar span{background:rgba(15,15,18,.92);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--gold-hi)}

/* classifica */
.envs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.env-tile{position:relative;border:1px solid var(--line-soft);border-radius:24px;background:linear-gradient(170deg,#1a1114,#120c0e);padding:48px 14px 16px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;color:var(--fg);min-height:158px}
.env-tile.total{grid-column:1/-1;min-height:150px}
.env-tile .seal{position:absolute;top:-16px;left:50%;margin-left:-26px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e7a8,#d4af37 55%,#8a6a1c);display:grid;place-items:center;color:#4a3608;box-shadow:0 8px 20px -6px rgba(0,0,0,.8)}
.env-tile .seal svg{width:26px;height:26px}
.env-tile small{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.env-tile b{font:500 22px/1.1 var(--display)}
.env-tile .sealed{color:var(--mute);font-size:14px;margin-top:6px}
.env-tile .win{margin-top:6px;font-size:16px;color:var(--gold-hi)}
.env-tile.open{border-color:var(--gold);background:linear-gradient(170deg,#241a0b,#14100a)}
.env-tile:not(.open){opacity:.88}
.segc{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none}
.segc::-webkit-scrollbar{display:none}
.segc button{flex:1 0 auto;background:none;border:0;border-radius:999px;padding:10px 16px;color:var(--mute);font-weight:500;white-space:nowrap}
.segc button.on{background:linear-gradient(180deg,#e3c55b,#c99d2b);color:#16120a}
.rrow{display:grid;grid-template-columns:34px 54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.rrow .pos{font:500 28px/1 var(--display);font-variant-numeric:lining-nums;color:var(--mute);text-align:center}
.rrow.p1 .pos{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
.rrow.p2 .pos{color:#cfd2da}
.rrow.p3 .pos{color:#c98a52}
.rrow img{width:54px;height:54px;border-radius:50%;object-fit:cover;background:var(--panel-2)}
.rrow .mn{min-width:0;display:flex;flex-direction:column;gap:2px}
.rrow .mn b{font:500 19px/1.15 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .mn span{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--foil);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.rrow .sc{text-align:right;font:500 24px/1 var(--display);font-variant-numeric:lining-nums tabular-nums}
.rrow .sc small{display:block;font:400 12px/1.2 var(--body);color:var(--mute);margin-top:4px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mini>div{border:1px solid var(--line-soft);border-radius:22px;padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.mini h4{font:500 18px/1.2 var(--display)}
.mini li{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:15px}
.mini ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mini li b{color:var(--fg);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pronostici */
.pk{display:flex;flex-direction:column;gap:12px;padding:20px 0;border-bottom:1px solid var(--line-soft)}

.pk-list{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}

.pk-item{flex:0 0 92px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mute);font-size:13px;text-align:center}
.pk-item img{width:78px;height:78px;border-radius:50%;object-fit:cover;border:2px solid var(--line-soft);transition:.2s;background:var(--panel-2)}
.pk-item span{display:block;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-item.on{color:var(--gold-hi)}
.pk-item.on img{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.18),0 10px 24px -8px rgba(212,175,55,.6);transform:scale(1.06)}
.pk-item[disabled]{pointer-events:none}
.res{font-size:15px;display:flex;gap:10px;align-items:center}
.res.ok{color:var(--ok)}
.res.ko{color:#ff9aa5}

/* regia */
.panel{border:1px solid var(--line-soft);border-radius:24px;background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0}
.sw b{font-weight:500}
.sw small{display:block;color:var(--mute);font-size:13px}
.tg{position:relative;width:56px;height:32px;border-radius:999px;border:1px solid var(--line-soft);background:var(--panel-2);flex:none;transition:.25s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mute);transition:.25s}
.tg.on{background:rgba(212,175,55,.22);border-color:var(--gold)}
.tg.on::after{left:27px;background:var(--gold)}
.cer{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line-soft)}
.cer:first-of-type{border-top:0}
.cer .l{min-width:0;display:flex;flex-direction:column;gap:2px}
.cer .l b{font:500 20px/1.15 var(--display)}
.cer .l span{color:var(--mute);font-size:14px}
.cer .btn{padding:11px 18px;font-size:15px;flex:none}
.rm{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line-soft)}
.rm span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm .btn{padding:8px 14px;font-size:14px}
.btn.danger{border-color:var(--velvet-hi);color:#ff9aa5}

.cover-wrap{border-radius:26px;overflow:hidden;border:1px solid var(--line);background:var(--panel);aspect-ratio:4/5;display:grid;place-items:center;max-width:460px;width:100%}
.cover-wrap img{width:100%;height:100%;object-fit:cover}
.two{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}

/* overlay: copertina */
#lightbox{position:fixed;inset:0;z-index:40;background:rgba(5,5,6,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .3s ease}
#lightbox .cv{max-height:72vh;max-width:min(92vw,520px);aspect-ratio:4/5;border-radius:18px;border:1px solid var(--line);box-shadow:0 40px 90px -30px rgba(212,175,55,.5);animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
#lightbox .cv img{width:100%;height:100%;object-fit:contain;border-radius:18px}
#lightbox .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* palco: cerimonia */
#stage{position:fixed;inset:0;z-index:50;background:#050506;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transition:opacity .5s}
#stage.shown{opacity:1}
#stage .spot{position:absolute;left:50%;top:-12%;width:130vmax;height:130vmax;margin-left:-65vmax;background:conic-gradient(from 168deg at 50% 0%,transparent 0deg,rgba(255,236,170,.2) 12deg,transparent 24deg);transform-origin:50% 0;animation:sweep 5s ease-in-out infinite alternate;pointer-events:none}
@keyframes sweep{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.st-in{position:relative;z-index:2;width:100%;max-width:560px;padding:24px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.st-title{font:500 clamp(28px,7.5vw,44px)/1.1 var(--display);text-wrap:balance}
.st-title em{font-style:italic;color:var(--gold)}
.env{position:relative;width:min(78vw,340px);aspect-ratio:3/2;perspective:900px;transition:opacity .6s,transform .6s}
.env .bk{position:absolute;inset:0;border-radius:12px;background:linear-gradient(160deg,#8e1220,#5c0912);box-shadow:0 30px 60px -20px rgba(0,0,0,.9)}
.env .cd{position:absolute;left:7%;right:7%;top:9%;bottom:6%;border-radius:6px;background:#f6efdc;color:#16120a;display:grid;place-items:center;font:italic 500 22px/1 var(--display);z-index:1;transition:transform 1.1s cubic-bezier(.3,.8,.2,1)}
.env .fr{position:absolute;inset:0;border-radius:12px;z-index:2;background:linear-gradient(160deg,#a8172a,#6d0b17);clip-path:polygon(0 100%,0 30%,50% 64%,100% 30%,100% 100%)}
.env .fl{position:absolute;left:0;right:0;top:0;height:64%;z-index:3;transform-origin:50% 0;background:linear-gradient(180deg,#b3182a,#7a0f1a);clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:visible}
.env .sl{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-14px 0 0 -27px;border-radius:50%;z-index:4;background:radial-gradient(circle at 35% 30%,#f7e7a8,#d4af37 55%,#8a6a1c);display:grid;place-items:center;color:#4a3608;box-shadow:0 8px 18px -4px rgba(0,0,0,.8);transition:opacity .3s}
.env .sl svg{width:28px;height:28px}
.env.shake{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:translate(-2px,1px) rotate(-.6deg)}75%{transform:translate(2px,-1px) rotate(.6deg)}}
.env.open .sl{opacity:0}
.env.open .fl{animation:flap .75s ease forwards}
@keyframes flap{0%{transform:rotateX(0);z-index:3}49%{z-index:3}50%{transform:rotateX(90deg);z-index:0}100%{transform:rotateX(180deg);z-index:0}}
.env.open .cd{transform:translateY(-46%)}
.env.gone{opacity:0;transform:scale(.9) translateY(30px);pointer-events:none;position:absolute}
.winners{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.winners .card{flex:0 0 min(74vw,300px);cursor:default;animation:win 1s cubic-bezier(.2,.8,.2,1) backwards}

.st-score{color:var(--gold-hi);font-size:18px}
.st-hint{color:var(--mute);font-size:13px;letter-spacing:.2em;text-transform:uppercase}

/* intro sipario */
#curtain{position:fixed;inset:0;z-index:70;animation:cgone .01s 2.15s forwards}
@keyframes cgone{to{visibility:hidden;pointer-events:none}}

#curtain .cr{right:0;animation:opr 1.4s cubic-bezier(.7,0,.2,1) .7s forwards}

#curtain .ct{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;z-index:2;animation:fadeout .5s ease .55s forwards}

@keyframes fadeout{to{opacity:0}}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:45;background:rgba(18,18,22,.96);border:1px solid var(--line);border-radius:999px;padding:12px 20px;font-size:15px;opacity:0;pointer-events:none;transition:.3s;max-width:calc(100vw - 32px);text-align:center}

.likert.closed{opacity:.55}

/* proiezione */
#proj{position:fixed;inset:0;z-index:35;background:#000;overflow:hidden;cursor:none}

#proj .ps{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}

@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}

#proj.chrome .ibtn{opacity:1}


/* cerimonia a film */
#stage canvas{z-index:5}
#stage .bars{position:absolute;left:0;right:0;height:0;background:#000;z-index:7;transition:height 1.2s cubic-bezier(.2,.7,.2,1);pointer-events:none}

#stage.shown .bars{height:min(9vh,70px)}
#stage::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(0,0,0,.72))}
#stage .fgr{position:absolute;inset:-10%;z-index:6;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:fgr .4s steps(3) infinite}

.pop{animation:fade .9s ease backwards}

.noms{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.nom{width:min(28vw,170px);display:flex;flex-direction:column;gap:8px;align-items:center;animation:win .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*1.1s)}
.nom img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;border:1.5px solid var(--gold)}

.fin{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

#stage.finale .spot{opacity:.95}

#fmCurtain{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}

#fmCurtain .cl{left:0;transform:translateX(-103%)}
#fmCurtain .cr{right:0;transform:translateX(103%)}

.covers{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ========= DATABASE CONDIVISO PER GITHUB PAGES =========

/* backend: db condiviso oppure dispositivo singolo */
function localBackend(){
  const KEY='rcn:data:v1';let data={};try{data=JSON.parse(ls.get(KEY)||'{}')}catch(e){}
  const subs={};const emit=c=>(subs[c]||[]).forEach(f=>f(Object.entries(data[c]||{})));
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('La memoria del dispositivo è piena.')}};
  return{mode:'local',
    sub(c,f){(subs[c]=subs[c]||[]).push(f);setTimeout(()=>f(Object.entries(data[c]||{})),0)},
    async set(c,id,v){(data[c]=data[c]||{})[id]=clone(v);persist();emit(c)},
    async clear(c){data[c]={};persist();emit(c)},
    async del(c,id){if(data[c]){delete data[c][id];persist();emit(c)}}};
}
function dbBackend(db){

    sub(c,f){let ref=db.collection(c);if(c==='gallery')ref=ref.orderBy('ts','desc').limit(80);ref.onSnapshot(s=>f(s.docs.map(d=>[d.id,d.data()])),e=>console.warn('db',c,e&&e.code))},

    del:(c,id)=>db.doc(c+'/'+id).delete()};
}
/* Firebase Realtime Database via REST + SSE: serve solo l'indirizzo del database (vedi README) */
function fbBackend(base){
  base=base.replace(/\/+$/,'');const cache={},subs={},opened={};
  const emit=c=>(subs[c]||[]).forEach(f=>f(Object.entries(cache[c]||{})));
  const setIn=(o,segs,val)=>{let x=o;for(let i=0;i<segs.length-1;i++){if(x[segs[i]]==null||typeof x[segs[i]]!=='object')x[segs[i]]={};x=x[segs[i]]}const k=segs[segs.length-1];if(val==null)delete x[k];else x[k]=val};
  const apply=(c,path,data,merge)=>{
    const segs=path.split('/').filter(Boolean);
    if(merge){Object.keys(data||{}).forEach(k=>apply(c,path.replace(/\/$/,'')+'/'+k,data[k],false));return}
    if(!segs.length){cache[c]=data&&typeof data==='object'?data:{};return}
    cache[c]=cache[c]||{};setIn(cache[c],segs,data);
  };
  const open=c=>{if(opened[c])return;opened[c]=true;
    const es=new EventSource(base+'/'+c+'.json');
    ['put','patch'].forEach(t=>es.addEventListener(t,ev=>{try{const m=JSON.parse(ev.data);apply(c,m.path||'/',m.data,t==='patch');emit(c)}catch(e){}}));
  };
  const url=(c,id)=>base+'/'+c+(id?'/'+encodeURIComponent(id):'')+'.json';
  const send=async(m,u,body)=>{const r=await fetch(u,{method:m,body});if(!r.ok)throw new Error('db '+r.status)};
  return{mode:'db',
    sub(c,f){(subs[c]=subs[c]||[]).push(f);if(cache[c])setTimeout(()=>f(Object.entries(cache[c])),0);open(c)},
    async set(c,id,v){(cache[c]=cache[c]||{})[id]=clone(v);emit(c);await send('PUT',url(c,id),JSON.stringify(v))},
    async del(c,id){if(cache[c])delete cache[c][id];emit(c);await send('DELETE',url(c,id))},
    async clear(c){cache[c]={};emit(c);await send('DELETE',url(c))}};
}

const urlCache={};
function dataToUrl(key,d){
  if(!d)return '';const c=urlCache[key];if(c&&c.src===d)return c.url;
  try{const parts=d.split(',');const mime=parts[0].match(/:(.*?);/)[1];const bin=atob(parts[1]);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:mime}));if(c)URL.revokeObjectURL(c.url);urlCache[key]={src:d,url};return url}catch(e){return d}
}
const outfit=id=>dataToUrl(id+'o',S.photos[id]&&S.photos[id].outfit);

function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('img'));im.src=src})}
async function shrinkFile(file,max,type,q){
  const u=URL.createObjectURL(file);let im;try{im=await loadImg(u)}finally{URL.revokeObjectURL(u)}
  const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.max(1,Math.round(im.naturalWidth*r)),h=Math.max(1,Math.round(im.naturalHeight*r));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#000';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);return c.toDataURL(type,q);
}
async function fitOutfit(file){let max=1000,q=.74,out='';for(let i=0;i<6;i++){out=await shrinkFile(file,max,'image/jpeg',q);if(out.length<165000)return out;max=Math.round(max*.84);q=Math.max(.5,q-.06)}return out}
async function fitLogo(file){let out=await shrinkFile(file,200,'image/png');if(out.length<38000)return out;let q=.82,max=200;for(let i=0;i<5;i++){out=await shrinkFile(file,max,'image/jpeg',q);if(out.length<38000)return out;max=Math.round(max*.85);q-=.08}return out}
async function monogram(text,hue){
  try{await document.fonts.load('900 80px "Playfair Display"')}catch(e){}
  const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d');
  const g=x.createRadialGradient(70,60,10,100,100,110);g.addColorStop(0,'#f7e7a8');g.addColorStop(.55,'#d4af37');g.addColorStop(1,'#8a6a1c');x.fillStyle=g;x.beginPath();x.arc(100,100,98,0,7);x.fill();
  x.fillStyle='#2a1d05';x.font='900 84px "Playfair Display",serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,100,106);return c.toDataURL('image/png');
}

const coverCache={};
function spaced(x,text,px,y,sp,align){
  const chars=Array.from(text);let w=0;const ws=chars.map(ch=>{const m=x.measureText(ch).width;w+=m+sp;return m});w-=sp;
  let cx=align==='center'?px-w/2:align==='right'?px-w:px;x.textAlign='left';chars.forEach((ch,i)=>{x.fillText(ch,cx,y);cx+=ws[i]+sp});
}
function fitSize(x,text,fontTpl,maxW,start){x.font=fontTpl.replace('%s',start);const w=x.measureText(text).width;return w>maxW?Math.floor(start*maxW/w):start}
function clip(x,text,maxW){if(x.measureText(text).width<=maxW)return text;let t=text;while(t.length>1&&x.measureText(t+'…').width>maxW)t=t.slice(0,-1);return t+'…'}
async function makeCover(id){
  const t=S.teams[id],ph=S.photos[id];if(!t||!ph||!ph.outfit)return null;
  const key=id+'|'+[t.name,t.p1,t.p2,t.inspo,t.n].join('|')+'|'+ph.outfit.length;if(coverCache[key])return coverCache[key];
  try{await Promise.all([document.fonts.load('900 100px "Playfair Display"'),document.fonts.load('italic 900 100px "Playfair Display"'),document.fonts.load('600 30px Outfit'),document.fonts.load('400 30px Outfit')])}catch(e){}
  const im=await loadImg(outfit(id));
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);

let AC=null,noiseBuf=null;
/* colonna sonora: il file lo carica l'admin dal proprio dispositivo */
const MUSIC={url:null,name:'',el:null,on:false,fade:0,saved:false};
const musicDB=()=>new Promise((ok,no)=>{try{const q=indexedDB.open('rcn-music',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}});
async function musicSave(f){try{const d=await musicDB();await new Promise((ok,no)=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').put({blob:f,name:f.name},'song');tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});MUSIC.saved=true}catch(e){MUSIC.saved=false}}

const chorusSec=()=>{try{const v=parseFloat(localStorage.getItem('rcn:chorus'));return isFinite(v)&&v>=0?v:45}catch(e){return 45}};
function musicStart(el,rev){
  if(!MUSIC.url||!S.sound)return;clearInterval(MUSIC.fade);
  const a=MUSIC.el||(MUSIC.el=new Audio());if(a.src!==MUSIC.url)a.src=MUSIC.url;a.loop=true;a.volume=.9;MUSIC.on=true;
  const go=()=>{try{const L=a.duration;if(isFinite(L)&&L>0){const x=rev==null?el:el-rev+chorusSec();a.currentTime=((x%L)+L)%L}}catch(e){}};
  a.addEventListener('loadedmetadata',go,{once:true});go();
  const p=a.play();if(p&&p.catch)p.catch(()=>{MUSIC.on=false});
}
function musicStop(now){
  const a=MUSIC.el;MUSIC.on=false;clearInterval(MUSIC.fade);if(!a)return;
  if(now){a.pause();return}
  MUSIC.fade=setInterval(()=>{a.volume=Math.max(0,a.volume-.06);if(a.volume<=0){clearInterval(MUSIC.fade);a.pause();a.volume=.9}},120);
}
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function drumroll(sec){
  if(!S.sound||MUSIC.on)return;const a=ac();if(!a)return;
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.06,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}
  const t0=a.currentTime+.02,n=Math.floor(sec/.05);
  for(let i=0;i<n;i++){const t=t0+i*.05,p=i/n;const src=a.createBufferSource();src.buffer=noiseBuf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=260+p*240;f.Q.value=.8;const g=a.createGain();g.gain.value=.12+.5*p*p;src.connect(f);f.connect(g);g.connect(a.destination);src.start(t)}
}
function fanfare(){
  if(!S.sound||MUSIC.on)return;const a=ac();if(!a)return;const t0=a.currentTime+.05;
  [[392,0,.22],[494,.2,.22],[587,.4,.22],[784,.62,1.3],[988,.62,1.3],[1175,.62,1.3]].forEach(([f,at,d])=>{const o=a.createOscillator();o.type='triangle';o.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(0,t0+at);g.gain.linearRampToValueAtTime(.14,t0+at+.03);g.gain.exponentialRampToValueAtTime(.001,t0+at+d);o.connect(g);g.connect(a.destination);o.start(t0+at);o.stop(t0+at+d+.05)});
}
function heartbeat(sec){
  if(!S.sound||MUSIC.on)return;const a=ac();if(!a)return;let t=a.currentTime+.05;const end=t+sec;let gap=1.0;
  while(t<end){[0,.2].forEach((d,i)=>{const o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(70,t+d);o.frequency.exponentialRampToValueAtTime(38,t+d+.16);const g=a.createGain();g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(i?.45:.7,t+d+.012);g.gain.exponentialRampToValueAtTime(.001,t+d+.22);o.connect(g);g.connect(a.destination);o.start(t+d);o.stop(t+d+.25)});t+=gap;gap=Math.max(.5,gap-.06)}
}
function bigFanfare(){
  if(!S.sound||MUSIC.on)return;const a=ac();if(!a)return;const t0=a.currentTime+.05;
  [[262,0,.3],[330,.18,.3],[392,.36,.3],[523,.54,.4],[659,.8,.4],[784,1.05,2.8],[1047,1.05,2.8],[523,1.05,2.8],[1319,1.05,2.4]].forEach(([f,at,d])=>{const o=a.createOscillator();o.type=at>1?'sawtooth':'triangle';o.frequency.value=f;const flt=a.createBiquadFilter();flt.type='lowpass';flt.frequency.value=at>1?1800:3000;const g=a.createGain();g.gain.setValueAtTime(0,t0+at);g.gain.linearRampToValueAtTime(at>1?.07:.14,t0+at+.04);g.gain.exponentialRampToValueAtTime(.001,t0+at+d);o.connect(flt);flt.connect(g);g.connect(a.destination);o.start(t0+at);o.stop(t0+at+d+.05)});
}
let rainRaf=0;
function goldRain(ms){
  if(reduce())return;const cv=$('#rain');cv.width=innerWidth;cv.height=innerHeight;const x=cv.getContext('2d');const cols=['#f4e4a1','#d4af37','#fff3c4','#b3182a','#ffffff'];
  const ps=[];const t0=performance.now();let last=t0;cancelAnimationFrame(rainRaf);
  (function f(now){const dt=Math.min(32,now-last)/16;last=now;
    if(now-t0<ms){for(let i=0;i<4;i++)ps.push({x:Math.random()*cv.width,y:-12,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:3+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.25,c:cols[Math.random()*cols.length|0],sw:Math.random()*6})}
    x.clearRect(0,0,cv.width,cv.height);
    for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.sw+=.05*dt;p.x+=(p.vx+Math.sin(p.sw)*1.2)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.y>cv.height+20){ps.splice(i,1);continue}x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()}

}
let confRaf=0;
function confetti(){
  if(reduce())return;const cv=$('#confetti');cv.width=innerWidth;cv.height=innerHeight;const x=cv.getContext('2d');const cols=['#f4e4a1','#d4af37','#b3182a','#ffffff','#8a6a1c'];
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.62,vx:(Math.random()-.5)*15,vy:-8-Math.random()*13,r:3+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0],life:1}));
  cancelAnimationFrame(confRaf);let last=performance.now();
  (function f(now){const dt=Math.min(32,now-last)/16;last=now;x.clearRect(0,0,cv.width,cv.height);let alive=false;
    ps.forEach(p=>{p.vy+=.28*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.99;p.rot+=p.vr*dt;p.life-=.0045*dt;if(p.life>0&&p.y<cv.height+20){alive=true;x.save();x.globalAlpha=Math.max(0,p.life);x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()}});
    if(alive)confRaf=requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})(last);

/* ---------- calcolo voti ---------- */
function tally(){
  const out={};Object.keys(S.teams).forEach(id=>{out[id]={sum:{},cnt:{},voters:new Set(),avg:{},id}});
  Object.entries(S.votes).forEach(([voter,doc])=>{
    if(!S.teams[voter]||!doc||!doc.by)return;
    Object.entries(doc.by).forEach(([tid,sc])=>{
      if(tid===voter||!out[tid]||!sc)return;const o=out[tid];
      ALL_KEYS.forEach(k=>{const v=Number(sc[k]);if(v>=1&&v<=5){o.sum[k]=(o.sum[k]||0)+v;o.cnt[k]=(o.cnt[k]||0)+1;o.voters.add(voter)}});
    });
  });
  Object.values(out).forEach(o=>{
    Object.keys(o.sum).forEach(k=>{o.avg[k]=o.sum[k]/o.cnt[k]});
    o.n=o.voters.size;o.pts=(cfg().totalAll?ALL_KEYS:MAIN_KEYS).reduce((n,k)=>n+(o.sum[k]||0),0);
    o.avg.total=o.n?o.pts:null;
  });
  return out;
}
const valOf=(o,k)=>k==='total'?o.pts:o.avg[k];
const fmtV=(k,v)=>k==='total'?Math.round(v)+' pt':fmt(v);
const awardInfo=k=>ALL_AWARDS.find(a=>a.k===k);
function ranking(key,T){
  T=T||tally();
  return Object.values(T).filter(o=>o.avg[key]!=null).sort((a,b)=>valOf(b,key)-valOf(a,key)||b.n-a.n||(S.teams[a.id].name||'').localeCompare(S.teams[b.id].name||''));
}
function winnersOf(key,T){
  const r=ranking(key,T);if(!r.length)return null;const top=Math.round(valOf(r[0],key)*1e6);
  return{ids:r.filter(o=>Math.round(valOf(o,key)*1e6)===top).map(o=>o.id),score:valOf(r[0],key)};
}
function revealedMap(){const c=cfg().ceremony;return(c&&c.results&&Date.now()>=c.t0+c.dur)?c.results:{}}
function myProgress(){
  if(!S.me)return{done:0,total:0,open:0};
  const ok=openKeys(),mine=(S.votes[S.me.id]&&S.votes[S.me.id].by)||{},others=Object.keys(S.teams).filter(id=>id!==S.me.id);
  return{open:ok.length,total:others.length,done:ok.length?others.filter(id=>mine[id]&&ok.every(k=>mine[id][k]>=1)).length:0};
}

      <div class="stack" style="gap:10px"><span class="lbl">Foto dell’outfit</span>
        <label class="drop" for="f-photo"><span class="pv sq" id="pvPhoto" ${r.outfit?`style="background-image:url(${r.outfit})"`:''}>${r.outfit?'':ic('cam')}</span><span class="tx"><b>Scatta o scegli la foto</b><span>Diventa la copertina della vostra rivista. Meglio in verticale.</span></span><input type="file" id="f-photo" accept="image/*"></label></div>

V.done=()=>{
  const me=myTeam();if(!me)return V.home();
  return `<div class="stack" style="gap:22px"><p class="eyebrow">Iscrizione completata</p><h1 class="display">Siete sul tappeto rosso!</h1><p class="lead">Conservate questo codice: serve per votare le altre coppie. È già salvato su questo telefono.</p>${ticketHTML()}<div class="cta-row"><button class="btn gold" data-go="home">Entra nel sito</button><button class="btn" data-go="coppie">Vedi le coppie</button></div></div>`;
};
const ticketHTML=()=>`<div class="ticket">${ic('ticket')}<span class="code" id="codeTx">${esc(S.me&&S.me.code||'')}</span><button class="ibtn" data-act="copy" aria-label="Copia il codice">${ic('copy')}</button></div>`;

V.io=()=>{
  const me=myTeam();
  if(!me)return `<div class="stack"><p class="eyebrow">Il vostro profilo</p><h1 class="display">Entrate in gara</h1><p class="lead">Con un codice potete votare, fare i pronostici e riavere la vostra copertina.</p><div class="cta-row"><button class="btn gold" data-go="reg">Iscrivi la coppia</button><button class="btn" data-go="join">Ho già un codice</button></div></div>`;

  <div class="cta-row"><button class="btn gold" data-act="dl" data-id="${me.id}">${ic('down')}Scarica la copertina</button></div><p class="note" id="dlNote"></p></div></div>`;
};

V.vota=()=>{
  const me=myTeam();
  if(!me)return gate('Votate le altre coppie','Serve il codice della vostra coppia: i voti si danno solo dopo l’iscrizione.');
  const others=teamList().filter(t=>t.id!==me.id),ok=openKeys();
  if(S.arg&&S.teams[S.arg]&&S.arg!==me.id)return votaDetail(S.arg,me);
  const mine=(S.votes[me.id]&&S.votes[me.id].by)||{},p=myProgress();
  const rows=others.map((t,i)=>{const v=mine[t.id]||{};const n=ok.filter(k=>v[k]>=1).length,tot=ALL_KEYS.filter(k=>v[k]>=1).length;
    const st=ok.length&&n===ok.length?'<span class="state done">Votata</span>':n>0?`<span class="state part">${n}/${ok.length}</span>`:tot>0?'<span class="state part">In attesa</span>':'<span class="state">Da votare</span>';
    return `<button class="vcard ${S.fresh?'enter':''}" style="--i:${i}" data-go="vota" data-arg="${t.id}"><img src="${outfit(t.id)}" alt=""><span class="m"><b>${esc(t.name)}</b><span>${esc(t.inspo)}</span></span>${st}</button>`}).join('');
  const info=ok.length?`<p class="lead">Per ogni coppia, tranne la vostra, date da 1 a 5 ai criteri aperti. Avete completato ${p.done} coppie su ${p.total}.</p><div class="chips">${ok.map(k=>`<span class="chip live"><i></i>${esc(critName(k))}</span>`).join('')}</div>`
    :`<div class="lock">${ic('lock')}<p>Nessuna votazione aperta. L’admin apre i criteri uno alla volta durante la serata: tornate qui quando ne parte uno.</p></div>`;
  return `<div class="stack"><p class="eyebrow">Le vostre schede</p><h1 class="display">Il vostro voto, ora.</h1>${info}</div><div class="stack" style="margin-top:22px;gap:12px">${others.length?rows:`<div class="empty"><h3>Servono altre coppie</h3><p>Appena si iscrive qualcun altro, comparirà qui per essere votato.</p></div>`}</div>`;
};
function votaDetail(tid,me){
  const t=S.teams[tid],v=((S.votes[me.id]&&S.votes[me.id].by)||{})[tid]||{};const ro=S.readOnly||S.canWrite===false;
  const others=teamList().filter(x=>x.id!==me.id),idx=others.findIndex(x=>x.id===tid),nxt=others[(idx+1)%others.length];
  const lk=cr=>{const op=isOpen(cr.k),dis=!op||ro;
    return `<div class="likert ${op?'':'closed'}" data-c="${cr.k}"><div class="lk-h"><h4>${cr.t}</h4><span class="state ${op?'done':''}">${op?'Aperta':'Chiusa'}</span></div><p>${cr.d}</p><div class="scale" role="radiogroup" aria-label="${cr.t}">${[1,2,3,4,5].map(n=>`<button class="lk ${v[cr.k]===n?'on':''} ${v[cr.k]>n?'fill':''}" data-act="lk" data-k="${cr.k}" data-v="${n}" role="radio" aria-checked="${v[cr.k]===n}" aria-label="${n} su 5" ${dis?'disabled':''}>${n}</button>`).join('')}</div><div class="ends"><span>Da rivedere</span><span>Da Oscar</span></div></div>`};
  return `<div class="stack" style="gap:16px"><button class="back" data-go="vota">${ic('left')}Tutte le coppie</button>
  <div class="vhead"><img src="${outfit(tid)}" alt="Costume di ${esc(t.name)}"><div class="tt"><p class="eyebrow">${esc(t.kind||'')} · ${esc(t.name)}</p><h2>${esc(t.inspo)}</h2><span class="mute">${esc(t.p1)} &amp; ${esc(t.p2)}${t.chars?' · '+esc(t.chars):''}</span></div></div>
  ${openKeys().length?'':`<div class="lock">${ic('lock')}<p>Nessuna votazione aperta in questo momento.</p></div>`}
  <div class="group-t"><p class="eyebrow">Concorrono ai premi</p><i></i></div>${CRIT_MAIN.map(lk).join('')}
  <div class="group-t soft"><p class="eyebrow" style="color:var(--mute)">Fuori concorso</p><i></i></div><p class="note">Questi criteri raccontano la serata ma non contano per gli Oscar.</p>${CRIT_EXTRA.map(lk).join('')}
  <div class="savebar"><span id="saveState">I voti si salvano da soli</span></div>
  <div class="cta-row">${others.length>1?`<button class="btn gold" data-go="vota" data-arg="${nxt.id}">Prossima coppia ${ic('arrow')}</button>`:''}<button class="btn" data-go="vota">Torna all’elenco</button></div></div>`;
}

V.classifica=()=>{
  const sub=S.sub==='pronostici'?'pronostici':'premi';
  const seg=`<div class="segc" role="tablist"><button role="tab" class="${sub==='premi'?'on':''}" data-act="sub" data-k="premi">Premi</button><button role="tab" class="${sub==='pronostici'?'on':''}" data-act="sub" data-k="pronostici">Pronostici</button></div>`;
  return `<div class="stack"><p class="eyebrow">Notte degli Oscar</p><h1 class="display">${sub==='premi'?'I premi della serata':'Chi porta a casa la statuetta?'}</h1>${seg}</div>${sub==='premi'?premiBody():pronosticiBody()}`;
};
function premiBody(){
  const rev=revealedMap();
  const tile=a=>{const r=rev[a.k];const names=r?r.ids.map(id=>S.teams[id]?S.teams[id].name:'—').join(' · '):'';
    return `<div class="env-tile ${a.k==='total'?'total':''} ${r?'open':''}"><span class="seal">${ic('star')}</span><small>${a.extra?'Menzione':'Oscar'}</small><b>${a.t}</b>${r?`<span class="win">${esc(names)}${r.ids.length>1?' · ex aequo':''}</span>`:`<span class="sealed">${a.extra?'Da rivelare':'Busta sigillata'}</span>`}</div>`};
  return `<section class="sec" style="margin-top:30px"><div class="envs">${AWARDS.map(tile).join('')}</div></section>
  <section class="sec"><div class="stack" style="gap:10px"><p class="eyebrow">Menzioni speciali</p><h2 class="h2">Fuori concorso</h2><p class="note">Non contano per gli Oscar né per la Miglior Coppia.</p></div><div class="envs three">${MENTIONS.map(tile).join('')}</div></section>`;
}
function pronosticiBody(){
  const me=myTeam(),c=cfg(),l=teamList(),rev=revealedMap();
  if(!me)return `<div class="stack" style="margin-top:20px"><p class="lead">Serve il codice della vostra coppia per giocare ai pronostici.</p><div class="cta-row"><button class="btn gold" data-go="join">Ho già un codice</button><button class="btn" data-go="reg">Iscrivi la coppia</button></div></div>`;
  if(!l.length)return emptyTeams();
  const pk=S.picks[me.id]||{},dis=!c.picksOpen||S.readOnly||S.canWrite===false;
  const blocks=AWARDS.map(a=>{const r=rev[a.k],locked=dis||!!r;
    const items=l.map(t=>`<button class="pk-item ${pk[a.k]===t.id?'on':''}" data-act="pick" data-key="${a.k}" data-id="${t.id}" ${locked?'disabled':''} aria-pressed="${pk[a.k]===t.id}"><img src="${outfit(t.id)}" alt=""><span>${esc(t.name)}</span></button>`).join('');
    let res='';if(r&&pk[a.k]){const ok=r.ids.includes(pk[a.k]);res=`<p class="res ${ok?'ok':'ko'}">${ok?'Indovinato!':'Non questa volta.'} Ha vinto ${esc(r.ids.map(id=>S.teams[id]?S.teams[id].name:'—').join(' · '))}.</p>`}else if(r)res=`<p class="res mute">Busta aperta: ha vinto ${esc(r.ids.map(id=>S.teams[id]?S.teams[id].name:'—').join(' · '))}.</p>`;
    return `<div class="pk"><h4>${a.k==='total'?'Chi sarà la Miglior Coppia?':'Chi vincerà per '+a.t.toLowerCase()+'?'}</h4><div class="pk-list">${items}</div>${res}</div>`}).join('');
  const revKeys=AWARDS.filter(a=>rev[a.k]).map(a=>a.k);
  const sc={};Object.entries(S.picks).forEach(([tid,p])=>{if(!S.teams[tid])return;let s=0;revKeys.forEach(k=>{if(p&&p[k]&&rev[k].ids.includes(p[k]))s++});sc[tid]=s});
  const vv=revKeys.length?Object.entries(sc).sort((a,b)=>b[1]-a[1]).map(([id,s],i)=>`<div class="rrow p${s>0?i+1:9}"><span class="pos">${i+1}</span><img src="${outfit(id)}" alt=""><div class="mn"><b>${esc(S.teams[id].name)}</b><span>${esc(S.teams[id].p1)} &amp; ${esc(S.teams[id].p2)}</span></div><div class="sc">${s}<small>su ${revKeys.length}</small></div></div>`).join(''):'';
  return `<div class="stack" style="margin-top:14px"><p class="lead">Un nome per ogni Oscar. A fine serata scopriamo chi ha il fiuto migliore.</p>${dis&&!c.picksOpen?`<div class="lock">${ic('lock')}<p>I pronostici sono chiusi.</p></div>`:''}</div><div style="margin-top:10px">${blocks}</div>${vv?`<section class="sec"><div class="stack" style="gap:10px"><p class="eyebrow">I veggenti</p><h2 class="h2">Chi ci ha preso</h2></div><div>${vv}</div></section>`:''}`;
}

V.regia=()=>{
  if(!S.admin)return V.home();
  const c=cfg(),T=tally(),l=teamList(),demo=l.some(t=>t.demo),cer=c.ceremony,ok=openKeys(),seq=ceremonyOrder(T),done=!!(cer&&Date.now()>=cer.t0+cer.dur);
  const sw=(attr,on,t,s)=>`<div class="sw"><div><b>${esc(t)}</b><small>${s}</small></div><button class="tg ${on?'on':''}" ${attr} role="switch" aria-checked="${on}" aria-label="${esc(t)}"></button></div>`;
  const critRow=cr=>sw(`data-act="crit-sw" data-k="${cr.k}"`,isOpen(cr.k),cr.t,isOpen(cr.k)?'Aperta: gli ospiti possono votare.':'Chiusa.');
  const mins=seq.length?Math.max(1,Math.round(showDur(seq)/60000)):0;

  return `<div class="stack"><p class="eyebrow">Regia della serata</p><h1 class="display">Il pannello dell’admin</h1><p class="lead">Qui decidete cosa si vota e quando parte la cerimonia. Nessuno, voi compresi, vede i risultati finché la cerimonia non finisce.</p></div>
  <section class="sec"><div class="stack" style="gap:10px"><p class="eyebrow">Votazioni</p><h2 class="h2">Cosa si vota adesso</h2><p class="note">Aprite un criterio alla volta e chiudetelo quando volete. Gli ospiti votano solo i criteri aperti.</p></div>
  <div class="panel"><p class="lbl">Criteri Oscar</p>${CRIT_MAIN.map(critRow).join('')}<p class="lbl" style="margin-top:8px">Fuori concorso</p>${CRIT_EXTRA.map(critRow).join('')}<div class="cta-row"><button class="btn" data-act="crit-all" data-v="1">Apri tutte</button><button class="btn" data-act="crit-all" data-v="0">Chiudi tutte</button></div></div></section>
  <section class="sec"><div class="panel">${sw('data-act="sw" data-k="picksOpen"',c.picksOpen,'Pronostici aperti','Si chiudono da soli quando parte la cerimonia.')}</div></section>
  <section class="sec"><div class="stack" style="gap:10px"><p class="eyebrow">Cerimonia</p><h2 class="h2">La premiazione</h2><p class="note">Un solo pulsante chiude tutte le votazioni e fa partire la sequenza su tutti i telefoni e sul maxischermo: prima le menzioni, poi gli Oscar uno alla volta, per ultima la Miglior Coppia. ${mins?'Dura circa '+mins+' minuti.':''}</p></div>
  <div class="panel">
    ${sw('data-act="sw" data-k="totalAll"',!!c.totalAll,'Nel totale conta anche il fuori concorso','Spento: la Miglior Coppia somma solo i criteri Oscar. Decidetelo prima di avviare.')}
    <p class="note">${ok.length?'Ancora aperte: '+esc(ok.map(critName).join(', '))+'.':'Tutte le votazioni sono chiuse.'}</p>
    <button class="btn gold" data-act="cer-start" ${seq.length?'':'disabled'}>${S.confirmCer?'Confermate: chiudo tutto e parto':'Chiudi le votazioni e avvia la cerimonia'}</button>
    ${cer?`${done?'<div class="cta-row"><button class="btn" data-act="cer-local">Rivedi solo su questo telefono</button><button class="btn" data-act="cer-again">Riproponi su tutti gli schermi</button></div>':'<p class="note">Cerimonia in corso o appena avviata.</p>'}<button class="btn danger" data-act="reseal">Sigilla di nuovo i risultati</button>`:''}
  </div></section>
  <section class="sec"><div class="stack" style="gap:10px"><p class="eyebrow">Colonna sonora</p><h2 class="h2">Musica della cerimonia</h2><p class="note">Caricate il file audio di <em>Firework</em> (Katy Perry): suona per tutta la cerimonia e il ritornello parte esattamente quando si scopre la Miglior Coppia. Con «Ascolta dal ritornello» controllate che il secondo indicato sia quello giusto. Resta salvato sul dispositivo da cui lo caricate (non serve ricaricarlo ogni volta) e suona solo lì, quindi usate quello collegato alle casse o al proiettore.</p></div>
  <div class="panel"><p class="note" id="musicName">${MUSIC.url?'Caricato: '+esc(MUSIC.name)+(MUSIC.saved?' · salvato su questo dispositivo, non serve ricaricarlo.':' · non salvato, va ricaricato dopo un aggiornamento della pagina.'):'Nessun file caricato.'}</p><div class="field"><label for="f-music">File audio (mp3, m4a…)</label><input class="inp" id="f-music" type="file" accept="audio/*"></div><div class="field"><label for="f-chorus">Il ritornello inizia al secondo (es. 45)</label><input class="inp" id="f-chorus" type="number" inputmode="decimal" min="0" step="1" value="${chorusSec()}"></div>${MUSIC.url?'<div class="cta-row"><button class="btn" data-act="music-test">Prova la musica</button><button class="btn" data-act="music-chorus">Ascolta dal ritornello</button><button class="btn danger" data-act="music-rm">Rimuovi</button></div>':''}</div></section>
  <section class="sec"><div class="stack" style="gap:10px"><p class="eyebrow">Coppie iscritte</p><h2 class="h2">${l.length} in gara</h2></div><div class="panel">${rms||'<p class="note">Nessuna coppia iscritta.</p>'}</div></section>
  <section class="sec"><div class="stack" style="gap:10px"><p class="eyebrow">Accesso admin</p><h2 class="h2">Codice della regia</h2><p class="note">Cambiandolo, tutti gli altri telefoni admin vengono scollegati e devono rientrare con il nuovo codice. Questo telefono resta dentro.</p></div>
  <form id="codeForm" class="panel" novalidate><div class="field"><label for="f-new">Nuovo codice</label><input class="inp" id="f-new" type="password" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="Almeno 4 caratteri"></div><div class="field"><label for="f-new2">Ripetete il codice</label><input class="inp" id="f-new2" type="password" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="Di nuovo"></div><p class="err" id="codeErr" role="alert"></p><button class="btn gold" type="submit">Cambia il codice</button>${cfg().adminHash?'<button type="button" class="btn" data-act="code-reset">Torna al codice iniziale</button>':''}<button type="button" class="btn" data-act="admin-out">Esci dall’admin</button></form></section>
  <section class="sec"><div class="stack" style="gap:10px"><p class="eyebrow">Prove generali</p><h2 class="h2">Provate la cerimonia</h2><p class="note">Aggiunge sei coppie finte con voti casuali per provare classifica e cerimonia. Rimuovetele prima di far iscrivere gli ospiti.</p></div><div class="cta-row"><button class="btn" data-act="demo-add">Aggiungi coppie di prova</button>${demo?'<button class="btn danger" data-act="demo-rm">Rimuovi le prove</button>':''}</div></section>
  <section class="sec"><div class="stack" style="gap:10px"><p class="eyebrow">Zona pericolosa</p><h2 class="h2">Azzera l’app</h2><p class="note">Cancella coppie, foto, voti, pronostici, foto della serata e cerimonia. Il codice admin resta. I telefoni degli ospiti vengono scollegati.</p></div><div class="panel">${S.confirmReset?'<p class="note" style="color:#ff9aa5">Non si può annullare. Tutti i dati della serata spariscono.</p><button class="btn danger" data-act="reset-do">Sì, cancella tutto</button><button class="btn" data-act="reset-cancel">Annulla</button>':'<button class="btn danger" data-act="reset-ask">Resetta tutta l’app</button>'}</div></section>`;
};

function gate(title,txt){return `<div class="stack"><p class="eyebrow">Serve il codice</p><h1 class="display">${esc(title)}</h1><p class="lead">${esc(txt)}</p><div class="cta-row"><button class="btn gold" data-go="join">Ho già un codice</button><button class="btn" data-go="reg">Iscrivi la coppia</button></div></div>`}

/* ---------- rendering ---------- */
const FORM_ROUTES={reg:1,join:1,admin:1};
let rtimer=0;
function scheduleRender(){
  if(FORM_ROUTES[S.route]||(S.route==='vota'&&S.arg&&S.teams[S.arg]))return;
  clearTimeout(rtimer);rtimer=setTimeout(()=>{const ae=document.activeElement;if(ae&&ae.tagName==='INPUT'&&$('#view').contains(ae)){scheduleRender();return}render()},400);
}
function render(){
  const view=$('#view');const route=V[S.route]?S.route:'home';
  const scrolls=$$('.carousel,.pk-list',view).map(e=>e.scrollLeft);
  view.innerHTML=S.loaded.teams?V[route]():V.loader();
  $$('.carousel,.pk-list',view).forEach((e,i)=>{if(scrolls[i])e.scrollLeft=scrolls[i]});
  drawTabs();updateIcons();
  requestAnimationFrame(()=>{$$('.bar i',view).forEach(el=>{el.style.width=el.dataset.w+'%';S.prevW[el.dataset.k]=+el.dataset.w})});

  if(hashCode('adm'+code)!==adminHashNow()){err.textContent='Codice non corretto.';$('#f-pin').value='';return}
  setAdm(adminHashNow());recomputeAdmin();toast('Siete nella regia');go('regia');
}

/* ---------- foto della serata ---------- */
function ensureGallery(){if(S.galSub||!B)return;S.galSub=true;B.sub('gallery',en=>onCol('gallery',en))}
async function shrinkGal(f){let max=1100,q=.72,out='';for(let i=0;i<6;i++){out=await shrinkFile(f,max,'image/jpeg',q);if(out.length<175000)return out;max=Math.round(max*.84);q=Math.max(.5,q-.06)}return out}
async function addGallery(files){
  ensureGallery();let n=0;const me=myTeam();
  for(const f of files){
    try{
      const img=await shrinkGal(f),id='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      await B.set('gallery',id,{img,by:me?me.id:'',nm:me?me.name:'Ospite',ts:Date.now()});n++;
    }catch(e){if(e&&e.code)writeFail(e);else toast('Non riesco a leggere questa foto.')}
  }
  if(n)toast(n===1?'Foto aggiunta':n+' foto aggiunte');
}
function openPhoto(id){
  const p=galList().find(x=>x.id===id);if(!p)return;const lb=$('#lightbox');lb.hidden=false;
  lb.innerHTML=`<div class="cv free"><img src="${p.url}" alt="Foto di ${esc(p.nm)}"></div><p class="mute">${esc(p.nm)}</p><div class="acts"><button class="btn" data-act="lb-close">Chiudi</button></div>`;
}
const proj={on:false,timer:0,seen:new Set(),cur:null,flip:false,lock:null,chromeT:0};
function projPool(){
  const out=galList().map(p=>({id:'g:'+p.id,url:p.url,cap:p.nm,sub:'Foto della serata',ts:p.ts}));
  teamList().forEach(t=>{const u=outfit(t.id);if(u)out.push({id:'o:'+t.id,url:u,cap:t.name,sub:t.inspo,ts:0})});
  return out;
}
function projNext(){
  const pool=projPool(),box=$('#proj');
  if(!pool.length){$('#pjEmpty').hidden=false;$('#pjCap').innerHTML='';return}
  $('#pjEmpty').hidden=true;
  let pick=pool.filter(p=>p.ts&&!proj.seen.has(p.id)).sort((a,b)=>b.ts-a.ts)[0];
  if(!pick){
    let rest=pool.filter(p=>!proj.seen.has(p.id));
    if(!rest.length){proj.seen=new Set(proj.cur?[proj.cur]:[]);rest=pool.filter(p=>!proj.seen.has(p.id));if(!rest.length)rest=pool}
    pick=rest[Math.floor(Math.random()*rest.length)];
  }
  proj.seen.add(pick.id);proj.cur=pick.id;proj.flip=!proj.flip;
  const slides=$$('.ps',box),on=slides[proj.flip?1:0],off=slides[proj.flip?0:1];
  $$('i',on).forEach(i=>{i.style.backgroundImage='url("'+pick.url+'")'});
  on.classList.remove('kb');void on.offsetWidth;on.classList.add('on','kb');off.classList.remove('on');
  $('#pjCap').innerHTML='<small>'+esc(pick.sub)+'</small><b>'+esc(pick.cap)+'</b>';
}
function projChrome(){const b=$('#proj');b.classList.add('chrome');clearTimeout(proj.chromeT);proj.chromeT=setTimeout(()=>b.classList.remove('chrome'),3000)}
function projOpen(){
  ensureGallery();const box=$('#proj');box.hidden=false;proj.on=true;proj.seen=new Set();proj.flip=false;
  try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{proj.lock=l}).catch(()=>{})}catch(e){}
  projNext();clearInterval(proj.timer);proj.timer=setInterval(projNext,7000);projChrome();
}
function projClose(){
  proj.on=false;clearInterval(proj.timer);$('#proj').hidden=true;
  try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
  try{if(proj.lock)proj.lock.release()}catch(e){}
}

/* ---------- eventi ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-go],[data-act]');if(!el)return;
  if(el.dataset.go){go(el.dataset.go,el.dataset.arg);return}
  const a=el.dataset.act;
  if(a==='cover'){if(!el.closest('#stage'))openCover(el.dataset.id)}
  else if(a==='lb-close')$('#lightbox').hidden=true;
  else if(a==='dl')downloadCover(el.dataset.id);
  else if(a==='copy')copyCode();
  else if(a==='kind'){S.reg.kind=el.dataset.k;$$('#kindSeg button').forEach(b=>b.classList.toggle('on',b.dataset.k===S.reg.kind))}
  else if(a==='mono'){const nm=$('#f-name').value.trim();if(!nm){toast('Scrivete prima il nome della squadra.');return}S.reg.logo=await monogram(initials(nm));$('#pvLogo').style.backgroundImage=`url(${S.reg.logo})`;$('#pvLogo').innerHTML=''}
  else if(a==='lk'){
    const tid=S.arg,k=el.dataset.k,v=+el.dataset.v;if(!tid||!isOpen(k))return;setVote(tid,k,v);
    $$('.lk',el.closest('.likert')).forEach(b=>{const n=+b.dataset.v;b.classList.remove('on','fill');if(n===v)b.classList.add('on');else if(n<v)b.classList.add('fill');b.setAttribute('aria-checked',n===v)});
  }
  else if(a==='rank'){S.rank=el.dataset.k;render()}
  else if(a==='pick'){if(!S.me)return;const d=S.picks[S.me.id]=S.picks[S.me.id]||{};d[el.dataset.key]=el.dataset.id;queueSave('picks');render()}
  else if(a==='sw'){if(!S.admin)return;setCfg({[el.dataset.k]:!cfg()[el.dataset.k]})}
  else if(a==='cer-start'){
    if(!S.admin)return;
    if(!S.confirmCer){S.confirmCer=true;render();setTimeout(()=>{if(S.confirmCer){S.confirmCer=false;render()}},5000);return}
    S.confirmCer=false;startCeremony(false);
  }
  else if(a==='music-test'){if(MUSIC.on){musicStop()}else musicStart(0)}
  else if(a==='music-chorus'){musicStop(true);musicStart(chorusSec())}
  else if(a==='music-rm'){musicStop(true);URL.revokeObjectURL(MUSIC.url);MUSIC.url=null;MUSIC.name='';musicForget();render()}
  else if(a==='cer-again'){if(S.admin)startCeremony(true)}
  else if(a==='cer-local'){const c=cfg().ceremony;if(c&&c.results)playShow(Object.assign({},c,{ts:Date.now()}))}
  else if(a==='env-replay'){replayScene(el.dataset.key)}
  else if(a==='reseal'){if(S.admin)setCfg({ceremony:null,revealed:{}})}
  else if(a==='del-ask'){S.confirmDel=el.dataset.id;render()}
  else if(a==='del-do'){const id=el.dataset.id;S.confirmDel=null;try{await B.del('teams',id);await B.del('photos',id);await B.del('votes',id);await B.del('picks',id);toast('Coppia rimossa')}catch(err){writeFail(err)}}
  else if(a==='crit-sw'){if(S.admin)setCfg({crit:Object.assign({},cfg().crit,{[el.dataset.k]:!isOpen(el.dataset.k)})})}
  else if(a==='crit-all'){if(S.admin){const o={};ALL_KEYS.forEach(k=>{o[k]=el.dataset.v==='1'});setCfg({crit:o})}}
  else if(a==='sub'){S.sub=el.dataset.k;render()}
  else if(a==='gal-add'){$('#galInput').click()}
  else if(a==='gal-open')openPhoto(el.dataset.id);
  else if(a==='gal-del'){try{await B.del('gallery',el.dataset.id);toast('Foto rimossa')}catch(err){writeFail(err)}}
  else if(a==='proj')projOpen();
  else if(a==='reset-ask'){if(S.admin){S.confirmReset=true;render()}}
  else if(a==='reset-cancel'){S.confirmReset=false;render()}
  else if(a==='reset-do'){resetAll()}
  else if(a==='code-reset'){if(S.admin)resetCode()}
  else if(a==='admin-out'){clearAdm();recomputeAdmin();go('home')}
  else if(a==='demo-add')demoAdd();
  else if(a==='demo-rm')demoRm();
});
document.addEventListener('submit',e=>{
  if(e.target.id==='regForm'){e.preventDefault();submitReg()}
  else if(e.target.id==='joinForm'){e.preventDefault();submitJoin()}
  else if(e.target.id==='adminForm'){e.preventDefault();submitAdmin()}
  else if(e.target.id==='codeForm'){e.preventDefault();submitCode()}

});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='f-chorus'){try{localStorage.setItem('rcn:chorus',String(Math.max(0,parseFloat(t.value)||0)))}catch(err){}return}
  const f=t.files&&t.files[0];if(!f)return;
  if(t.id==='f-music'){await musicLoad(f);t.value='';toast(MUSIC.saved?'Musica salvata su questo dispositivo.':'Musica caricata, ma non riesco a salvarla: andrà ricaricata dopo un aggiornamento della pagina.');render();return}
  if(t.id==='galInput'){const fs=Array.from(t.files);t.value='';addGallery(fs);return}
  try{
    if(t.id==='f-photo'){S.reg.outfit=await fitOutfit(f);$('#pvPhoto').style.backgroundImage=`url(${S.reg.outfit})`;$('#pvPhoto').innerHTML=''}
    else if(t.id==='f-logo'){S.reg.logo=await fitLogo(f);$('#pvLogo').style.backgroundImage=`url(${S.reg.logo})`;$('#pvLogo').innerHTML=''}
  }catch(err){toast('Non riesco a leggere questa immagine. Provate con un’altra.')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#stage').hidden&&!$('#stClose').hidden)closeStage();else if(!$('#lightbox').hidden)$('#lightbox').hidden=true;else if(proj.on)projClose()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card')){e.preventDefault();e.target.click()}
});
$('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')$('#lightbox').hidden=true});
$('#stClose').addEventListener('click',closeStage);
$('#btnAdmin').addEventListener('click',()=>go(S.admin?'regia':'admin'));
$('#projClose').addEventListener('click',projClose);
$('#proj').addEventListener('pointermove',projChrome);
$('#proj').addEventListener('click',projChrome);
$('#btnSound').addEventListener('click',()=>{S.sound=!S.sound;ls.set('rcn:sound',S.sound?'1':'0');updateIcons();if(S.sound){const a=ac();if(a)drumroll(.4)}});
$('#btnExit').addEventListener('click',()=>{ls.del('rcn:me');S.me=null;updateIcons();toast('Siete usciti dal profilo');go('home')});
$('#view').addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;const c=e.target.closest('.card');if(!c||c.closest('#stage'))return;
  const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;c.style.setProperty('--ry',(px*10)+'deg');c.style.setProperty('--rx',(-py*10)+'deg');
});
$('#view').addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
$('#curtain').addEventListener('click',e=>e.currentTarget.remove());

/* ---------- avvio ---------- */
async function init(){
  try{if(sessionStorage.getItem('rcn:intro'))$('#curtain').remove();else sessionStorage.setItem('rcn:intro','1')}catch(e){}
  S.sound=ls.get('rcn:sound')!=='0';
  try{const m=JSON.parse(ls.get('rcn:me')||'null');if(m&&m.id)S.me=m}catch(e){}
  updateIcons();drawTabs();render();
  let db=null,user=null;
  if(window.claude&&window.claude.use){
    const to=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
    const res=await Promise.all([to(claude.use('db'),9000).catch(()=>null),claude.use('user').catch(()=>null),claude.use('downloads').catch(()=>null)]);
    db=res[0];user=res[1];D=res[2];
  }
  if(user){try{S.owner=!!(await user.canEdit());const w=await user.can('data.write');if(w===false)S.canWrite=false}catch(e){}}
  B=db?dbBackend(db):(FIREBASE_URL?fbBackend(FIREBASE_URL):localBackend());S.mode=B.mode;
  updateStrip();recomputeAdmin();
  ['teams','photos','votes','picks','config'].forEach(c=>B.sub(c,en=>onCol(c,en)));
  setTimeout(()=>{if(!S.loaded.teams){S.loaded.teams=true;render()}},4000);
}
init();
})();
</script>
